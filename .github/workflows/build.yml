name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # permet aussi un déclenchement manuel depuis l'onglet Actions

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Compilation + tests sur les trois plateformes cibles
  # ---------------------------------------------------------------------------
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Dépendances système nécessaires à egui/eframe (backend glow, x11/wayland)
      # — uniquement sur Linux.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libspeechd-dev \
            libssl-dev \
            libx11-dev

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --verbose

      - name: Run tests
        run: cargo test --verbose

  # ---------------------------------------------------------------------------
  # Vérifications de qualité (consultatif : n'échoue pas le workflow)
  # ---------------------------------------------------------------------------
  lint:
      name: Format & Clippy
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v4
  
        - name: Install Linux dependencies
          run: |
            sudo apt-get update
            sudo apt-get install -y \
              libgtk-3-dev \
              libxcb-render0-dev \
              libxcb-shape0-dev \
              libxcb-xfixes0-dev \
              libxkbcommon-dev \
              libspeechd-dev \
              libssl-dev \
              libx11-dev
  
        - name: Install Rust toolchain (stable + rustfmt + clippy)
          uses: dtolnay/rust-toolchain@stable
          with:
            components: rustfmt, clippy
  
        - name: Cache cargo
          uses: Swatinem/rust-cache@v2
  
        - name: Check formatting (informational)
          run: cargo fmt --all -- --check || echo "::notice::Des différences de formatage existent (cargo fmt). Non bloquant."
  
        - name: Clippy (informational)
          run: cargo clippy --all-targets || echo "::notice::Clippy a signalé des remarques. Non bloquant."
