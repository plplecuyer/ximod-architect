name: Release

on:
  push:
    tags:
      - 'v*'          # se déclenche sur les tags v1.0.0, v1.2.3, v2.0.0-beta, etc.
  workflow_dispatch:  # permet aussi un lancement manuel (test)

permissions:
  contents: write     # requis pour créer la release et y déposer les fichiers

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release (${{ matrix.target-name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target-name: windows
            bin: ximod-architect.exe
          - os: ubuntu-latest
            target-name: linux
            bin: ximod-architect
          - os: macos-latest
            target-name: macos
            bin: ximod-architect

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libspeechd-dev \
            libssl-dev \
            libx11-dev

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --verbose

      # --- Empaquetage Linux / macOS : exécutable + assets dans un .tar.gz ---
      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          STAGE="XIMOD_Architect_${VERSION}_${{ matrix.target-name }}"
          mkdir -p "dist/${STAGE}"
          cp "target/release/${{ matrix.bin }}" "dist/${STAGE}/"
          cp -r assets "dist/${STAGE}/"
          [ -f README.md ] && cp README.md "dist/${STAGE}/" || true
          tar -czf "dist/${STAGE}.tar.gz" -C dist "${STAGE}"
          echo "ASSET=dist/${STAGE}.tar.gz" >> "$GITHUB_ENV"

      # --- Empaquetage Windows : exécutable + assets dans un .zip ---
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Version = $env:GITHUB_REF_NAME
          $Stage = "XIMOD_Architect_${Version}_windows"
          New-Item -ItemType Directory -Force -Path "dist/$Stage" | Out-Null
          Copy-Item "target/release/${{ matrix.bin }}" "dist/$Stage/"
          Copy-Item -Recurse "assets" "dist/$Stage/"
          if (Test-Path "README.md") { Copy-Item "README.md" "dist/$Stage/" }
          Compress-Archive -Path "dist/$Stage" -DestinationPath "dist/$Stage.zip"
          "ASSET=dist/$Stage.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
