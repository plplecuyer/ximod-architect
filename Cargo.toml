[package]
name = "ximod-architect"
version = "1.0.0"
edition = "2024"
rust-version = "1.97.1"
authors = ["XIMOD Team"]
description = "Cross-platform FOMOD installer creation tool for Bethesda game mods"
license = "MIT"
repository = "https://github.com/ximod/ximod-architect"
keywords = ["fomod", "modding", "skyrim", "fallout", "starfield"]
categories = ["gui", "games"]
build = "build.rs"

[dependencies]
# GUI Framework - using glow backend (more stable on Windows)
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.29", features = ["image", "file", "svg"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }

# XML Processing  
quick-xml = { version = "0.37", features = ["serialize"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = { version = "2", features = ["serde"] }

# File dialogs
rfd = "0.15"

# Internationalization
fluent = "0.16"
fluent-bundle = "0.15"
unic-langid = "0.9"

# Utilities
dirs = "5.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"

# Packaging translations for submission
zip = { version = "2", default-features = false, features = ["deflate"] }
uuid = { version = "1.0", features = ["v4"] }
walkdir = "2.5"
rand = "0.8"

# Platform-specific dependencies for native transparent splash
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Console",
] }

[target.'cfg(target_os = "linux")'.dependencies]
x11 = { version = "2.21", features = ["xlib"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
cocoa = "0.26"

# Build dependencies for Windows resource embedding
[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true

[[bin]]
name = "ximod-architect"
path = "src/main.rs"
