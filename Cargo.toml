[package]
name = "ximod-architect"
version = "2.0.0"
edition = "2024"
rust-version = "1.98.1"
authors = ["XIMOD Team"]
description = "Cross-platform FOMOD installer creation tool for Bethesda game mods"
license = "MIT"
repository = "https://github.com/ximod/ximod-architect"
keywords = ["fomod", "modding", "skyrim", "fallout", "starfield"]
categories = ["gui", "games"]
build = "build.rs"

[dependencies]
# GUI Framework - using glow backend (more stable on Windows)
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.29", features = ["image", "file", "svg"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }

# XML Processing  
quick-xml = "0.37"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = { version = "2", features = ["serde"] }

# File dialogs
rfd = "0.15"

# Internationalization
fluent = "0.16"
unic-langid = "0.9"

# Utilities
dirs = "5.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"

# Update check (query GitHub Releases API over HTTPS)
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

# Packaging translations for submission
zip = { version = "2", default-features = false, features = ["deflate"] }
# 7z export (V2): pure-Rust 7-Zip writer/reader (LZMA2)
sevenz-rust = "0.6"
walkdir = "2.5"
rand = "0.8"
egui-phosphor = "0.7.3"

# Platform-specific dependencies for native transparent splash
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Console",
] }

[target.'cfg(target_os = "linux")'.dependencies]
x11 = { version = "2.21", features = ["xlib"] }

# Build dependencies for Windows resource embedding
[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true

# Dependencies (image decoding, SVG, LZMA2, egui) are painfully slow without
# optimisation; compiling them at -O2 keeps debug builds of our own code fast
# to iterate on while making the app and the tests usable.
[profile.dev.package."*"]
opt-level = 2

[[bin]]
name = "ximod-architect"
path = "src/main.rs"
